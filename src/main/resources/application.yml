server:
  port: 8080

spring:
  profiles:
    # 로컬에서 개발 시 기본으로 'local-cafe24-db' 프로필을 사용하도록 변경
    default: local-cafe24-db

  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  admin:
    username: admin
    password: admin1234
  # 파일 업로드 디렉토리 경로 (사용자 홈 디렉토리 아래 elang-uploads 폴더)
  upload-dir: ${user.home}/elang-uploads/
  # OpenAI API 설정
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

logging:
  level:
    org.hibernate.SQL: info
